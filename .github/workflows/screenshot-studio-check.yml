name: Screenshot Studio check

on:
  pull_request:
    paths:
      - 'tools/screenshot-studio/**'
      - 'tools/test-screenshot-studio.mjs'
      - 'docs/screenshot-studio.md'
      - '.github/workflows/screenshot-studio-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate screenshot scenes
        run: node tools/test-screenshot-studio.mjs

  itch-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build itch package
        run: node tools/build-itch.js
      - name: Rename artifact
        run: mv dist-itch.zip pokegang-v0.5.0-itch.zip
      - name: Upload itch zip
        uses: actions/upload-artifact@v4
        with:
          name: pokegang-v0.5.0-itch
          path: pokegang-v0.5.0-itch.zip
          if-no-files-found: error
          retention-days: 3
