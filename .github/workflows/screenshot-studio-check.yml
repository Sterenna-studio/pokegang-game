name: Screenshot Studio check

on:
  pull_request:
    paths:
      - 'tools/screenshot-studio/**'
      - 'tools/test-screenshot-studio.mjs'
      - 'docs/screenshot-studio.md'
      - '.github/workflows/screenshot-studio-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate screenshot scenes
        run: node tools/test-screenshot-studio.mjs
