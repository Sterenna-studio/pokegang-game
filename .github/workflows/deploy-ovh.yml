name: Deploy PokéGang to OVH

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-pokegang-ovh
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static site to OVH via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add deployment marker
        run: |
          echo "PokéGang deploy" > deploy-test.txt
          echo "Commit: $GITHUB_SHA" >> deploy-test.txt
          echo "Date: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> deploy-test.txt

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OVH_SSH_KEY }}" > ~/.ssh/ovh_key
          chmod 600 ~/.ssh/ovh_key
          ssh-keyscan -H "${{ secrets.OVH_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure remote target directory exists
        run: |
          ssh -i ~/.ssh/ovh_key "${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}" "mkdir -p ~/pokegang ~/pokegang/studio"

      - name: Deploy to OVH with rsync
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='LICENSE' \
            --exclude='supabase/' \
            --exclude='tools/' \
            --exclude='studio/' \
            --exclude='test/' \
            --exclude='info/' \
            --exclude='docs/*.md' \
            --exclude='docs/*.sql' \
            -e "ssh -i ~/.ssh/ovh_key" \
            ./ "${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}:~/pokegang/"

      # Screenshot Studio is the only internal tool intentionally published.
      # It stays under tools/ in the repo (and outside the itch build), while
      # OVH exposes it at /studio/ for quick release/devlog screenshot work.
      - name: Deploy Screenshot Studio
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/ovh_key" \
            tools/screenshot-studio/ "${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}:~/pokegang/studio/"

      # Le cache-busting ?v=<hash> ne couvre que les <script src>/<link href>
      # d'index.html — les `import '...'` imbriqués dans les fichiers JS n'ont
      # pas d'URL versionnée, donc Cloudflare peut continuer à servir une
      # ancienne copie (jusqu'à 7 jours, cf. cache-control sur la zone) même
      # après un déploiement qui a changé leur contenu sur l'origine.
      - name: Purge Cloudflare cache
        run: |
          response=$(curl -s -w '\n%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$http_code" != "200" ] || ! echo "$body" | grep -q '"success":true'; then
            echo "::error::Cloudflare cache purge failed (HTTP $http_code)"
            exit 1
          fi
