<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>PokéGang — Carte du gang (OBS)</title>
  <link rel="icon" type="image/png" href="../assets/pokegang_logo/pokegang_logo_little.png">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css?v=1a0f0004">
  <style>
    /* Source navigateur OBS : la PAGE est transparente (elle se compose
       par-dessus le flux), mais la CARTE elle-même reste opaque — un overlay
       texte sur vidéo est illisible sans fond, contrairement au vivarium dont
       les sprites se suffisent à eux-mêmes. */
    html, body {
      background: transparent;
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-body);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gc-message {
      font-size: 13px;
      color: var(--text-dim);
      background: rgba(10, 10, 10, .92);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      max-width: 460px;
      line-height: 1.6;
    }
    .gc-message code { color: var(--gold); }

    .gc-card {
      background: linear-gradient(160deg, rgba(16,16,18,.96) 0%, rgba(26,12,12,.96) 100%);
      border: 2px solid var(--gold-dim);
      border-radius: 10px;
      box-shadow: 0 8px 40px rgba(0,0,0,.6), inset 0 0 60px rgba(204,51,51,.05);
      padding: 20px 24px;
      min-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── En-tête : sprite du boss + identité ── */
    .gc-head { display: flex; align-items: center; gap: 16px; }
    .gc-boss {
      width: 72px; height: 72px;
      image-rendering: pixelated;
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px rgba(204,51,51,.35));
    }
    .gc-ident { min-width: 0; }
    .gc-gang {
      font-family: var(--font-pixel);
      font-size: 15px;
      color: var(--gold);
      letter-spacing: .06em;
      line-height: 1.5;
    }
    .gc-boss-name {
      font-size: 13px;
      color: var(--text);
      margin-top: 4px;
    }
    .gc-title {
      font-size: 11px;
      color: var(--text-dim);
      font-style: italic;
      margin-top: 3px;
    }

    /* ── Réputation : la stat vedette ── */
    .gc-rep {
      display: flex;
      align-items: baseline;
      gap: 8px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 10px 0;
    }
    .gc-rep-star { color: var(--gold); font-size: 16px; }
    .gc-rep-val {
      font-family: var(--font-pixel);
      font-size: 20px;
      color: var(--gold);
    }
    .gc-rep-lbl {
      font-family: var(--font-pixel);
      font-size: 8px;
      color: var(--text-dim);
      letter-spacing: .12em;
    }

    /* ── Stats secondaires ── */
    .gc-stats { display: flex; gap: 22px; }
    .gc-stat { display: flex; flex-direction: column; gap: 3px; }
    .gc-stat b {
      font-family: var(--font-pixel);
      font-size: 12px;
      color: var(--text);
      font-weight: normal;
    }
    .gc-stat span {
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: .04em;
    }

    /* ── Pokédex ── */
    .gc-dex {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-dim);
    }
    .gc-dex-lbl {
      font-family: var(--font-pixel);
      font-size: 8px;
      color: var(--gold-dim);
      letter-spacing: .08em;
    }
    .gc-dex-val b { color: var(--text); font-weight: normal; }
    .gc-dex-sep { opacity: .4; }

    /* ── Badges ── */
    .gc-badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .gc-badge {
      font-size: 9px;
      border: 1px solid;
      border-radius: 3px;
      padding: 3px 7px;
      white-space: nowrap;
    }

    /* ── Régions : débloquées en doré, verrouillées en grisé ── */
    .gc-regions { display: flex; gap: 6px; }
    .gc-region {
      font-family: var(--font-pixel);
      font-size: 8px;
      letter-spacing: .06em;
      padding: 4px 8px;
      border-radius: 3px;
      border: 1px solid var(--border);
      color: var(--text-dim);
      opacity: .35;
    }
    .gc-region.on {
      border-color: var(--gold-dim);
      color: var(--gold);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="cardRoot"></div>

  <script type="module" src="./card-app.js?v=d196123e"></script>
</body>
</html>
