# Supabase project config — PokéGang dedicated backend
# Remote project: pokegang (ref: ojklmobvafovftqvevzh)
# https://ojklmobvafovftqvevzh.supabase.co
# https://supabase.com/docs/guides/cli/config
#
# Link once locally:
#   supabase login
#   supabase link --project-ref ojklmobvafovftqvevzh
#
# Apply versioned migrations:
#   supabase db push
#
# Deploy Edge Functions:
#   supabase functions deploy pokegang-api
#   supabase functions deploy pokegang-leaderboard-submit
#   supabase functions deploy pokegang-analytics-ingest --no-verify-jwt
#
# Browser builds must only use the publishable/anon key. Never ship a secret
# or service_role key in web/itch artifacts.

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "https://pokegang.sterenna.fr"
additional_redirect_urls = ["https://pokegang.sterenna.fr"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.pokegang-api]
# Public read API; no platform-level JWT requirement.
verify_jwt = false

[functions.pokegang-leaderboard-submit]
# Anonymous players can submit a score. The function validates/sanitizes the
# payload and links user_id only when a valid user access token is present.
verify_jwt = false

[functions.pokegang-analytics-ingest]
# Apps Script sends a Google OAuth bearer token rather than a Supabase JWT.
# The function validates that token against GA4 property 547494860 before any
# service-role database write is allowed.
verify_jwt = false
