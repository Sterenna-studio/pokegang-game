<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="app-version" content="2.4.0">
  <title>PokéGang — Gotta rule em all</title>
  <link rel="icon" type="image/png" href="assets/pokegang_logo/pokegang_logo_little.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/base.css?v=94d4ecd5">
  <link rel="stylesheet" href="./css/intro.css?v=89b54717">
  <link rel="stylesheet" href="./css/game-ui.css?v=9b3c0739">
</head>
<body>

  <!-- ── Dopamine Popups (outside #app so they overlay everything) ── -->
  <div id="shinyPopup">
    <div class="popup-icon">✨</div>
    <img class="popup-sprite" id="shinyPopupSprite" src="" alt="">
    <div class="popup-label" id="shinyPopupLabel">SHINY !</div>
  </div>
  <div id="rarePopup">
    <img class="rare-sprite" id="rarePopupSprite" src="" alt="">
    <div>
      <div class="rare-label" id="rarePopupLabel" data-i18n="static_rare_sighting">Pokémon rare aperçu !</div>
      <div class="rare-hint" id="rarePopupHint"></div>
    </div>
  </div>
  <div id="miniCombatPopup">
    <div class="mcp-sprites">
      <img class="mcp-sprite mcp-agent" id="miniCombatPopupAgent" src="" alt="">
      <span class="mcp-vs">VS</span>
      <img class="mcp-sprite mcp-enemy" id="miniCombatPopupEnemy" src="" alt="">
    </div>
    <div>
      <div class="mcp-label" id="miniCombatPopupLabel" data-i18n="static_combat_resolved">Combat résolu</div>
      <div class="mcp-detail" id="miniCombatPopupDetail"></div>
    </div>
  </div>

  <!-- Zone unlock popup -->
  <div id="zoneUnlockPopup">
    <div class="unlock-box">
      <div class="unlock-title" data-i18n="static_zone_unlocked">🗺 ZONE DÉBLOQUÉE !</div>
      <div class="unlock-zone" id="zoneUnlockName">—</div>
      <div class="unlock-rep"  id="zoneUnlockRep"></div>
      <div class="unlock-btns">
        <button class="unlock-btn-go"    id="zoneUnlockGo" data-i18n="static_go_to_zone">→ Aller à la zone</button>
        <button class="unlock-btn-later" id="zoneUnlockClose" data-i18n="static_later">Plus tard</button>
      </div>
    </div>
  </div>

  <div id="app">

    <!-- ═══ Top Bar ═══ -->
    <header id="topBar">
      <button id="btnBackToIntro" title="Retour à l'accueil" data-i18n-title="static_back_home" style="font-family:var(--font-pixel);font-size:16px;padding:4px 8px;background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:4px;color:var(--text-dim);cursor:pointer;transition:all .2s;line-height:1">🏠</button>
      <div id="gangNameDisplay">Team ???</div>
      <div id="moneyDisplay"><span>₽</span> 0</div>
      <div id="repDisplay">⭐ 0</div>
      <div id="pokemonCountDisplay" title="Pokémon possédés" data-i18n-title="static_owned_pokemon" style="cursor:default;display:flex;align-items:center;gap:4px"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" style="width:20px;height:20px;image-rendering:pixelated" onerror="this.style.display='none'"> 0</div>
      <button id="btnCodex" title="Codex — Prix & Spawns" data-i18n-title="static_codex_hint" style="padding:2px 5px;background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:4px;cursor:pointer;transition:all .2s;display:flex;align-items:center"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/town-map.png" style="width:22px;height:22px;image-rendering:pixelated" onerror="this.style.display='none'"></button>
      <span id="supaIndicator" title="Compte cloud" data-i18n-title="static_cloud_account"></span>
      <button id="notifBell" class="notif-bell-btn" title="Notifications" aria-label="Notifications" data-i18n-title="notif_title" data-i18n-aria-label="notif_title">🔔<span id="notifBadge" class="notif-badge" style="display:none">0</span></button>
      <button id="btnSettings" aria-label="Settings" data-i18n-aria-label="static_settings">⚙</button>
    </header>

    <!-- ── Session delta + Objective ── -->
    <div id="sessionBar" style="display:none;align-items:center;gap:8px;padding:3px 16px;background:rgba(0,0,0,.5);border-bottom:1px solid var(--border);font-size:10px;min-height:22px;font-family:var(--font-pixel)"></div>
    <div id="objectiveBar" style="display:none;align-items:center;gap:4px;padding:4px 16px;background:rgba(255,204,90,.04);border-bottom:1px solid rgba(255,204,90,.15);font-size:10px;min-height:26px"></div>

    <!-- ═══ Tab Navigation ═══ -->
    <nav id="tabNav">
      <button class="tab-btn active" data-tab="tabZones"><span data-i18n="static_tab_zones">Zones</span> <span class="tab-info-btn" data-info-tab="tabZones">ℹ</span></button>
      <button class="tab-btn" data-tab="tabPC"><span data-i18n="static_tab_pokemon">Pokémon</span> <span class="tab-info-btn" data-info-tab="tabPC">ℹ</span></button>
      <button class="tab-btn" data-tab="tabAgents"><span data-i18n="static_tab_agents">Agents</span> <span class="tab-info-btn" data-info-tab="tabAgents">ℹ</span></button>
      <button class="tab-btn" data-tab="tabMarket"><span data-i18n="static_tab_market">Marché</span> <span class="tab-info-btn" data-info-tab="tabMarket">ℹ</span></button>
      <button class="tab-btn" data-tab="tabGang"><span data-i18n="static_tab_gang">Gang</span> <span class="tab-info-btn" data-info-tab="tabGang">ℹ</span></button>
      <button class="tab-btn" data-tab="tabPokedex"><span data-i18n="static_tab_pokedex">Pokédex</span> <span class="tab-info-btn" data-info-tab="tabPokedex">ℹ</span></button>
      <button class="tab-btn" data-tab="tabBattleLog" data-i18n="static_tab_events">📋 Évts</button>
      <button class="tab-btn" data-tab="tabMissions" id="tabBtnMissions" data-i18n="static_tab_missions">Missions</button>
      <button class="tab-btn" data-tab="tabCompetition" id="tabBtnCompetition" data-i18n="static_tab_raids" style="margin-left:auto">⚔️ Raids</button>
      <button class="tab-btn" data-tab="tabLeaderboard" id="tabBtnLeaderboard">🏆</button>
      <button class="tab-btn" data-tab="tabCompte" id="tabBtnCompte" data-i18n="static_tab_account">☁ Compte</button>
      <button class="tab-btn" id="btnSaveSlots" data-i18n="static_tab_saves" style="border-color:var(--gold-dim);color:var(--gold-dim)">Saves</button>
    </nav>

    <!-- ═══ Tab Content ═══ -->
    <div id="hintBar" style="display:none;padding:6px 12px;font-family:var(--font-pixel);font-size:9px;color:var(--gold);background:rgba(0,0,0,0.6);border-bottom:1px solid var(--gold-dim);letter-spacing:.05em"></div>
    <main id="tabContent">

      <!-- ── Gang ── -->
      <section id="tabGang" class="tab-pane"></section>

      <!-- ── Événements ── -->
      <section id="tabBattleLog" class="tab-pane">
        <div style="display:flex;flex-direction:column;height:100%;overflow:hidden">
          <div id="feedHeader" style="display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--border);flex-shrink:0">
            <span style="font-family:var(--font-pixel);font-size:8px;color:var(--gold)" data-i18n="static_events_title">ÉVÉNEMENTS</span>
            <div id="feedFilters" style="display:flex;gap:4px;flex-wrap:wrap;margin-left:auto"></div>
            <button id="feedExportBtn" title="Exporter les logs" data-i18n-title="static_export_logs" style="flex-shrink:0;background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:3px;padding:2px 6px;cursor:pointer;font-size:10px;line-height:1.4">📥</button>
          </div>
          <div id="feedList" style="flex:1;overflow-y:auto;padding:4px 8px;display:flex;flex-direction:column;gap:2px;"></div>
        </div>
      </section>

      <!-- ── Agents ── -->
      <section id="tabAgents" class="tab-pane">
        <div style="padding:6px 12px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center">
          <div style="font-family:var(--font-pixel);font-size:8px;color:var(--text-dim)" data-i18n="static_org_chart">ORGANIGRAMME</div>
          <button id="btnToggleAgentTree" data-i18n="static_show_tree" style="font-size:9px;padding:3px 9px;background:var(--bg);border:1px solid var(--border-light);border-radius:var(--radius-sm);color:var(--text-dim);cursor:pointer">🌳 Afficher l'arbre</button>
          <button id="btnUnequipAll" data-i18n="static_unequip_all" style="font-size:9px;padding:4px 10px;background:var(--bg);border:1px solid var(--border-light);border-radius:var(--radius-sm);color:var(--text-dim);cursor:pointer;margin-left:auto">Tout déséquiper</button>
        </div>
        <div id="agentTreeContainer" style="display:none;padding:12px;border-bottom:1px solid var(--border);overflow-x:auto"></div>
        <div class="agents-grid" id="agentsGrid"></div>
      </section>

      <!-- ── Zones ── -->
      <section id="tabZones" class="tab-pane active">
        <!-- Region switcher — visible dès que Johto est débloqué ; Hoenn/Sinnoh apparaissent progressivement -->
        <div id="regionSwitcher" style="display:none;padding:4px 10px;border-bottom:1px solid var(--border);gap:6px;align-items:center;flex-wrap:wrap">
          <button class="region-btn active" data-region="kanto" style="font-family:var(--font-pixel);font-size:8px;padding:4px 10px;border-radius:4px;cursor:pointer">Kanto</button>
          <button class="region-btn" data-region="johto"  style="font-family:var(--font-pixel);font-size:8px;padding:4px 10px;border-radius:4px;cursor:pointer">Johto</button>
          <span id="regionDividerHoenn" style="display:none;width:1px;height:18px;background:var(--border);align-self:center;flex-shrink:0;opacity:.6"></span>
          <button class="region-btn" data-region="hoenn"  style="font-family:var(--font-pixel);font-size:8px;padding:4px 10px;border-radius:4px;cursor:pointer;display:none">Hoenn</button>
          <button class="region-btn" data-region="sinnoh" style="font-family:var(--font-pixel);font-size:8px;padding:4px 10px;border-radius:4px;cursor:pointer;display:none">Sinnoh</button>
        </div>

        <!-- Filter bar -->
        <div id="zoneFilterBar">
          <div id="zoneFilterTabs">
            <button class="zone-ftab active" data-filter="all" data-i18n="static_filter_all">Tout</button>
            <button class="zone-ftab" data-filter="fav" data-i18n="static_filter_favorites">★ Favoris</button>
            <button class="zone-ftab" data-filter="route" data-i18n="static_filter_routes">🗺 Routes</button>
            <button class="zone-ftab" data-filter="city" data-i18n="static_filter_cities">🏙 Villes</button>
            <button class="zone-ftab" data-filter="special" data-i18n="static_filter_special">⭐ Spéciaux</button>
            <button class="zone-ftab" data-filter="dex" title="Zones avec des Pokémon non encore capturés" data-i18n="static_filter_pokedex" data-i18n-title="static_filter_pokedex_hint">📖 Pokédex</button>
            <button class="zone-ftab" data-filter="dex_shiny" title="Zones avec des espèces sans chromatique" data-i18n="static_filter_shiny" data-i18n-title="static_filter_shiny_hint">✨ Chromas</button>
          </div>
          <div style="display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap;justify-content:flex-end">
            <span id="zoneOpenCount" class="zone-open-count" data-i18n="static_no_open_zone">0 zone ouverte</span>
            <button id="btnCollectAllZones" class="zones-close-all-btn" data-i18n="static_collect_all" style="background:var(--gold-dark,#7a6000);border-color:var(--gold-dim);color:var(--gold);display:none">₽ Tout récolter</button>
            <button id="btnCloseAllZones" class="zones-close-all-btn" data-i18n="static_close_all" style="display:none">✕ Fermer tout</button>
            <button id="btnToggleZoneStats" class="zones-close-all-btn" title="Basculer vue statistiques / carte" data-i18n-title="static_toggle_zone_view" style="display:block">📊</button>
          </div>
        </div>

        <!-- Zone selector (fog-map) + fav sidebar -->
        <div class="fog-map-layout">
          <div id="zoneSelector"></div>
          <div class="fog-fav-sidebar">
            <button id="btnFavFilter" class="fog-fav-pill" title="Voir uniquement les favoris" data-i18n-title="zone_selector_show_favorites">★</button>
          </div>
        </div>

        <!-- Gang Base + 2×2 zone windows side by side -->
        <div id="zonesTopArea">
          <div id="gangBaseContainer"></div>
          <div id="zoneWindows"></div>
        </div>
      </section>

      <!-- ── Market ── -->
      <section id="tabMarket" class="tab-pane">
        <div class="market-layout">
          <div id="specialItemPanel" class="market-panel special-item-panel">
            <h3 data-i18n="static_zone_access">ACCÈS ZONES</h3>
            <div class="special-list"></div>
          </div>
          <div id="shopPanel" class="market-panel">
            <h3 data-i18n="static_shop">BOUTIQUE</h3>
            <div class="shop-list"></div>
          </div>
          <div id="barterPanel" class="market-panel">
            <h3 data-i18n="static_barter">TROC</h3>
            <div class="barter-list"></div>
          </div>
          <div id="blackMarketPanel" class="market-panel black-market-panel">
            <h3 data-i18n="static_black_market">🌑 MARCHÉ NOIR</h3>
            <div class="bm-bulletin"></div>
          </div>
        </div>
      </section>

      <!-- ── PC ── -->
      <section id="tabPC" class="tab-pane">
        <div class="pc-layout">
          <div class="pc-main">
            <div id="filterBar">
              <input type="text" id="pcSearch" placeholder="Rechercher..." data-i18n-placeholder="static_search">
              <select id="pcSort">
                <option value="recent" data-i18n="static_sort_recent">Recent</option>
                <option value="potential" data-i18n="static_sort_potential">Potentiel</option>
                <option value="cp">PC</option>
                <option value="level" data-i18n="static_sort_level">Niveau</option>
                <option value="species" data-i18n="static_sort_species">Espece</option>
                <option value="id" data-i18n="static_sort_dex_number">No. Pokedex</option>
                <option value="name" data-i18n="static_sort_name">Nom A-Z</option>
                <option value="price" data-i18n="static_sort_price">Prix ₽</option>
              </select>
              <select id="pcFilter">
                <option value="all" data-i18n="static_filter_all_pc">Tous</option>
                <option value="fav" data-i18n="static_filter_favorites_pc">[FAV] Favoris</option>
                <option value="team" data-i18n="static_filter_team">[EQ] En equipe</option>
                <option value="shiny">[S] Shiny</option>
                <option value="pot5">***** (5)</option>
                <option value="pot4">**** (4)</option>
                <option value="pot3">*** (3)</option>
                <option value="pot2">** (2)</option>
                <option value="pot1">* (1)</option>
                <option value="pension" data-i18n="static_filter_daycare">[PS] Pension</option>
                <option value="training" data-i18n="static_filter_training">[TR] Formation</option>
              </select>
            </div>
            <div id="pokemonGrid"></div>
            <div id="pcPagination" class="pc-pagination"></div>
          </div>
          <aside id="pokemonDetail" class="hidden"></aside>
        </div>
      </section>

      <!-- ── Training Room ── -->
      <section id="tabTraining" class="tab-pane"></section>

      <!-- ── Science Lab ── -->
      <section id="tabLab" class="tab-pane"></section>

      <!-- ── Missions ── -->
      <section id="tabMissions" class="tab-pane"></section>

      <!-- ── Compétition de gangs (PvP en ligne) ── -->
      <section id="tabCompetition" class="tab-pane"></section>

      <!-- ── Classement global ── -->
      <section id="tabLeaderboard" class="tab-pane"></section>

      <!-- ── Compte (Supabase auth + cloud save) ── -->
      <section id="tabCompte" class="tab-pane"></section>

      <!-- ── Pokédex ── -->
      <section id="tabPokedex" class="tab-pane">
        <div class="dex-layout">
          <div class="dex-left">
            <div id="dexSearch" style="margin-bottom:8px"><input id="dexSearchInput" type="text" placeholder="Rechercher..." data-i18n-placeholder="static_search" style="width:100%;background:var(--bg-card);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 8px;font-family:var(--font-pixel);font-size:9px"></div>
            <div id="pokedexGrid"></div>
          </div>
          <aside id="dexDetail" class="dex-detail hidden"></aside>
        </div>
      </section>

    </main>

  </div>

  <!-- ═══ Notification Ticker (one-at-a-time, non-overlapping) ═══ -->
  <!-- Le panel complet est injecté par modules/ui/notifPanel.js -->
  <div id="notifTicker" class="notif-ticker"></div>

  <!-- ═══ Intro Overlay ═══ -->
  <div id="introOverlay">
    <button id="introSettingsBtn" title="Paramètres" data-i18n-title="static_settings">⚙</button>

    <!-- Atmospheric background -->
    <div class="intro-bg" aria-hidden="true">
      <div class="intro-bg-glow-top"></div>
      <div class="intro-bg-scanlines"></div>
    </div>

    <!-- Hero: logo + tagline + animated scene -->
    <div class="intro-hero">
      <img
        src="assets/pokegang_logo/pokegang_logo_full_B.png"
        alt="PokéGang"
        class="intro-logo-img"
      >
      <p class="intro-tagline" data-i18n="static_intro_tagline">Prends le contrôle de Kanto.</p>

      <div class="intro-scene-card">
        <div id="introSceneContainer" class="intro-scene">
          <!-- filled by JS -->
        </div>
        <div class="intro-dots" id="introSceneDots">
          <div class="intro-dot active"></div>
          <div class="intro-dot"></div>
          <div class="intro-dot"></div>
        </div>
      </div>

      <button id="introStartGameBtn" class="intro-start-btn" data-i18n="static_start_game">▶ Commencer une partie</button>
    </div>

    <!-- Saves panel anchored at bottom -->
    <div class="intro-saves-panel">
      <div class="intro-saves-header">
        <img src="assets/pokegang_logo/pokegang_logo_little.png" alt="" class="intro-saves-icon">
        <span class="intro-saves-label" data-i18n="static_saves">SAUVEGARDES</span>
        <span class="intro-saves-hint" data-i18n="static_choose_save">Choisis ou crée une partie</span>
      </div>
      <div class="intro-slots" id="introSlots">
        <!-- filled by JS -->
      </div>
      <div class="intro-slot-tools">
        <button id="btnHubImportSave" class="intro-slot-tool intro-slot-tool-import" data-i18n="static_import_save">📥 Importer une save</button>
        <button id="btnHubRepairSlot" class="intro-slot-tool intro-slot-tool-repair" data-i18n="static_repair_save">🔧 Réparer une save</button>
      </div>
    </div>

  </div>
  <!-- ═══ Settings Modal ═══ -->
  <div id="settingsModal">
    <div class="settings-box">
      <div class="settings-header">
        <h2 data-i18n="static_settings_title">⚙ Paramètres</h2>
        <button class="btn-close" id="btnCloseSettings" title="Fermer" data-i18n-title="static_close">&times;</button>
      </div>
      <div class="settings-content" id="settingsContent">
        <!-- rendered by renderSettingsPanel() -->
      </div>
      <div class="settings-footer">
        <div style="font-family:var(--font-pixel);font-size:7px;color:var(--text-dim);opacity:.6;letter-spacing:1px">
          PokéGang <span id="settingsVersion"></span>
        </div>
        <button class="btn-save-settings" id="btnSaveSettings" data-i18n="static_validate">✓ Valider</button>
      </div>
    </div>
  </div>

  <!-- Info Modal -->
  <div id="infoModal">
    <div class="info-box">
      <div class="info-title" id="infoModalTitle"></div>
      <div class="info-section" id="infoModalBody"></div>
      <button class="info-close" id="infoModalClose" data-i18n="static_close_with_icon">✕ Fermer</button>
    </div>
  </div>

  <!-- Supabase JS SDK (CDN) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!--
    Config Supabase locale (optionnelle) :
    chargée dynamiquement dans app.js via import() — voir _loadLocalSupabaseConfig().
    Le fichier ./config.js est un ES module exportant SUPABASE_URL et
    SUPABASE_PUBLISHABLE_KEY ; il n'est PAS chargé ici via <script> classique
    (sinon erreur "Unexpected token 'export'").
  -->
  <!-- Sprite data loaders (variables internes isolées dans IIFE, no global pollution) -->
  <!--
    defer (pas async) : ne bloque plus le parsing HTML, mais garde l'ordre
    d'exécution relatif au document — donc toujours avant app.js (type=module,
    différé par défaut, fait partie de la même liste ordonnée defer+module).
    Sans defer, ces ~260 Ko de scripts classiques bloquaient le parsing avant
    même d'atteindre le <script type="module"> qui suit.
  -->
  <script defer src="./data/loaders.js?v=9976ed89"></script>
  <script defer src="./data/species-data.js?v=da3253db"></script>
  <script defer src="./data/zones-data.js?v=ebbcd0e0"></script>
  <script defer src="./data/evolutions-data.js?v=7f8565ae"></script>
  <script defer src="./data/titles-data.js?v=776904fe"></script>
  <script defer src="./data/zones-johto-data.js?v=6cb442c5"></script>
  <script defer src="./data/zones-hoenn-data.js?v=113bc31a"></script>
  <script defer src="./data/zones-sinnoh-data.js?v=5fc631a9"></script>
  <script defer src="./data/regions-config.js?v=22ab8f2c"></script>
  <script defer src="./data/moves-data.js?v=d2daccb1"></script>
  <script type="module" src="./app.js?v=0fcdcb37"></script>
  <!-- Offline / background idle catchup system -->
  <script type="module" src="./modules/systems/offlineCatchup.js?v=77a465c8"></script>
  <!-- Offline mission report (modal de rapport au retour de tab) -->
  <script type="module" src="./modules/systems/offlineReport.js?v=b9801f08"></script>
</body>
</html>
